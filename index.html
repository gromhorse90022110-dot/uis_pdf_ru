<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачивание файла...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Скачивание файла должно начаться автоматически...</h2>
    <p>Если скачивание не началось, нажмите на кнопку ниже:</p>
    
    <!-- Запасная кнопка, если у пользователя отключен JavaScript -->
    <a class="btn" href="index.pdf" download="samouchitel_uis.pdf">Скачать PDF</a>

    <script>
        // Функция автоматического запуска скачивания
        window.onload = function() {
            const link = document.createElement('a');
            link.href = 'index.pdf';
            link.download = 'samouchitel_uis.pdf'; // Имя файла при сохранении
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

</body>
</html>
